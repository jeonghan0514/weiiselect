<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ 日本代購連線小幫手</title>
  <style>
    :root {
      --poke-red: #EE1515;
      --poke-dark-red: #CC0000;
      --poke-yellow: #FFDE00;
      --poke-blue: #3B4CCA;
      --poke-black: #222222;
      --bg-gray: #F4F6F9;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: var(--bg-gray); margin: 0; padding: 12px; color: var(--poke-black); }
    .container { max-width: 500px; margin: 0 auto; }

    /* 頂部標題與裝飾 */
    header {
      background: linear-gradient(135deg, var(--poke-red) 50%, var(--poke-black) 50%);
      color: white;
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(238, 21, 21, 0.3);
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }
    header h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
    header::after {
      content: '';
      position: absolute;
      right: -10px;
      bottom: -10px;
      width: 50px;
      height: 50px;
      background: var(--poke-yellow);
      border-radius: 50%;
      opacity: 0.2;
    }

    /* 分頁標籤 (Tabs) */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #E0E0E0;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--poke-red);
      color: white;
      box-shadow: 0 3px 8px rgba(238, 21, 21, 0.3);
    }

    /* 卡片通用樣式 */
    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border-top: 4px solid var(--poke-yellow);
    }
    .card h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 14px; color: var(--poke-black); display: flex; align-items: center; gap: 6px; }

    /* 表單元件 */
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; color: #555; margin-bottom: 4px; font-weight: bold; }
    .form-group input, .form-group select {
      padding: 11px;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--poke-blue);
    }

    /* 算價預覽區 */
    .price-box {
      background: #FFFDE7;
      border: 1px dashed var(--poke-yellow);
      padding: 12px;
      border-radius: 8px;
      color: #D32F2F;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 14px;
    }

    /* 按鈕樣式 */
    .btn-main {
      width: 100%;
      padding: 13px;
      background: var(--poke-red);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(204, 0, 0, 0.2);
    }
    .btn-main:hover { background: var(--poke-dark-red); }
    .btn-main:disabled { background: #ccc; box-shadow: none; }

    /* 清單列表樣式 */
    .product-item {
      background: #FAFAFA;
      border: 1px solid #EEEEEE;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .buyer-badge {
      background: var(--poke-blue);
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .type-badge {
      background: #E0E0E0;
      color: #333;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }
    .twd-price { color: var(--poke-red); font-weight: bold; font-size: 1.1rem; }
    .btn-delete { background: #FF5252; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-left: 8px; }

    /* 買家統整卡片樣式 */
    .buyer-summary-card {
      background: white;
      border-radius: 12px;
      border: 2px solid #E3F2FD;
      padding: 14px;
      margin-bottom: 14px;
    }
    .buyer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #F0F0F0;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .buyer-name { font-size: 1.1rem; font-weight: bold; color: var(--poke-blue); }
    .buyer-total { font-size: 1.2rem; font-weight: bold; color: var(--poke-red); }
    .buyer-item-list { font-size: 0.9rem; color: #444; line-height: 1.6; }
    .btn-copy {
      margin-top: 10px;
      width: 100%;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 隱藏未選中的分頁 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ 精靈球代購連線助手</h1>
  </header>

  <!-- 分頁切換按鈕 -->
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('tab-entry')">📝 現場登記</button>
    <button class="tab-btn" onclick="switchTab('tab-summary')">👤 買家統計</button>
  </div>

  <!-- 分頁一：現場即時登記與總列表 -->
  <div id="tab-entry" class="tab-content active">
    <!-- 登記表單 -->
    <div class="card">
      <h2>⚡ 買家採購登記</h2>
      
      <div class="form-group">
        <label>購買人姓名 / Line ID</label>
        <input type="text" id="buyer" placeholder="例如：小明 / 彥蓉">
      </div>

      <div class="form-group">
        <label>商品名稱</label>
        <input type="text" id="title" placeholder="例如：皮卡丘皮套公仔">
      </div>

      <div class="form-group">
        <label>計價類型</label>
        <select id="type" onchange="calcPrice()">
          <option value="merch">商品 / 一番賞 (匯率 0.27)</option>
          <option value="gachapon">扭蛋 (固定對照表)</option>
        </select>
      </div>

      <div class="form-group">
        <label>日幣價格 (¥)</label>
        <input type="number" id="priceJpy" placeholder="例如：500" oninput="calcPrice()">
      </div>

      <div class="price-box">
        算得台幣售價：<strong id="priceTwd">NT$ 0</strong>
      </div>

      <button class="btn-main" id="submitBtn" onclick="submitProduct()">新增採購紀錄</button>
    </div>

    <!-- 所有買採記錄列表 -->
    <div class="card">
      <h2>📋 即時記錄明細</h2>
      <div id="productList">載入中...</div>
    </div>
  </div>

  <!-- 分頁二：依購買人歸類統計 -->
  <div id="tab-summary" class="tab-content">
    <div class="card">
      <h2>📊 買家消費總覽</h2>
      <div id="buyerSummaryList">載入中...</div>
    </div>
  </div>
</div>

<!-- 載入 Firebase Realtime Database SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 你的 Firebase 設定檔
  const firebaseConfig = {
    apiKey: "AIzaSyBgm9M8aCSJH8iOf1_X-ZKSX4k9iiSyX1U",
    authDomain: "weiiselect.firebaseapp.com",
    databaseURL: "https://weiiselect-default-rtdb.firebaseio.com",
    projectId: "weiiselect",
    storageBucket: "weiiselect.firebasestorage.app",
    messagingSenderId: "379762570674",
    appId: "1:379762570674:web:2d45f355e153381ff060ab",
    measurementId: "G-MTYYGM67Y9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const productsRef = ref(db, 'products');

  // 全域變數存放最新資料
  let currentProducts = [];

  // 扭蛋固定價格對照表
  const gachaponTable = {
    100: 40, 200: 70, 300: 100, 400: 130, 500: 160,
    600: 200, 700: 220, 800: 250, 1000: 300, 2000: 580
  };

  // 分頁切換
  window.switchTab = function(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabId === 'tab-entry') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
    document.getElementById(tabId).classList.add('active');
  };

  // 匯率計算
  window.calcPrice = function() {
    const type = document.getElementById('type').value;
    const jpy = Number(document.getElementById('priceJpy').value) || 0;
    let twd = 0;

    if (type === 'gachapon') {
      twd = gachaponTable[jpy] || Math.ceil(jpy * 0.27);
    } else {
      twd = Math.ceil(jpy * 0.27);
    }

    document.getElementById('priceTwd').innerText = `NT$ ${twd}`;
    return twd;
  };

  // 提交商品紀錄
  window.submitProduct = async function() {
    const buyer = document.getElementById('buyer').value.trim();
    const title = document.getElementById('title').value.trim();
    const priceJpy = Number(document.getElementById('priceJpy').value);
    const type = document.getElementById('type').value;
    const priceTwd = window.calcPrice();

    if (!buyer || !title || !priceJpy) {
      alert('請填寫「購買人」、「商品名稱」與「日幣價格」！');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = '儲存中...';

    try {
      await push(productsRef, {
        buyer: buyer,
        title: title,
        type: type,
        priceJpy: priceJpy,
        priceTwd: priceTwd,
        createdAt: Date.now()
      });

      // 成功後清空商品名稱與價格（保留購買人方便繼續幫同一個人登記）
      document.getElementById('title').value = '';
      document.getElementById('priceJpy').value = '';
      window.calcPrice();
    } catch (e) {
      console.error(e);
      alert('儲存失敗，請檢查網路！');
    } finally {
      btn.disabled = false;
      btn.innerText = '新增採購紀錄';
    }
  };

  // 刪除紀錄
  window.deleteProduct = function(key) {
    if (confirm('確定要刪除這筆紀錄嗎？')) {
      const itemRef = ref(db, `products/${key}`);
      remove(itemRef);
    }
  };

  // 複製買家對帳文字
  window.copyBuyerDetails = function(buyerName, total, itemsText) {
    const text = `【日本代購對帳單 - ${buyerName}】\n-------------------\n${itemsText}-------------------\n合計台幣：NT$ ${total}`;
    navigator.clipboard.writeText(text).then(() => {
      alert(`已複製 ${buyerName} 的明細，可直接貼給對方！`);
    }).catch(() => {
      alert('複製失敗，請手動複製');
    });
  };

  // 監聽 Firebase 資料並即時渲染兩個分頁
  onValue(productsRef, (snapshot) => {
    const data = snapshot.val();
    const productList = document.getElementById('productList');
    const buyerSummaryList = document.getElementById('buyerSummaryList');

    if (!data) {
      productList.innerHTML = '<p style="color:#888; text-align:center;">目前無採購紀錄</p>';
      buyerSummaryList.innerHTML = '<p style="color:#888; text-align:center;">尚無買家資料</p>';
      return;
    }

    // 轉陣列並倒序（最新在最前）
    currentProducts = Object.keys(data).map(key => ({ key, ...data[key] })).reverse();

    // --- 1. 渲染即時列表 ---
    let entryHtml = '';
    currentProducts.forEach(item => {
      const typeText = item.type === 'gachapon' ? '扭蛋' : '商品';
      entryHtml += `
        <div class="product-item">
          <div>
            <span class="buyer-badge">${item.buyer}</span>
            <strong style="margin-left: 4px;">${item.title}</strong>
            <span class="type-badge">${typeText}</span>
            <div style="color: #666; font-size: 0.85rem; margin-top:4px;">¥ ${item.priceJpy}</div>
          </div>
          <div style="text-align: right;">
            <div class="twd-price">NT$ ${item.priceTwd}</div>
            <button class="btn-delete" onclick="deleteProduct('${item.key}')">刪除</button>
          </div>
        </div>
      `;
    });
    productList.innerHTML = entryHtml;

    // --- 2. 依「買家」歸類統計 ---
    const buyerMap = {};
    currentProducts.forEach(item => {
      if (!buyerMap[item.buyer]) {
        buyerMap[item.buyer] = { total: 0, items: [] };
      }
      buyerMap[item.buyer].items.push(item);
      buyerMap[item.buyer].total += item.priceTwd;
    });

    let summaryHtml = '';
    Object.keys(buyerMap).forEach(buyerName => {
      const group = buyerMap[buyerName];
      let itemsLines = '';
      let copyTextLines = '';

      group.items.forEach(it => {
        itemsLines += `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span>• ${it.title} (¥${it.priceJpy})</span>
          <strong>NT$ ${it.priceTwd}</strong>
        </div>`;
        copyTextLines += `• ${it.title}：NT$ ${it.priceTwd}\n`;
      });

      summaryHtml += `
        <div class="buyer-summary-card">
          <div class="buyer-header">
            <span class="buyer-name">👤 ${buyerName}</span>
            <span class="buyer-total">總計 NT$ ${group.total}</span>
          </div>
          <div class="buyer-item-list">
            ${itemsLines}
          </div>
          <button class="btn-copy" onclick="copyBuyerDetails('${buyerName}', ${group.total}, \`${copyTextLines}\`)">
            📋 複製 ${buyerName} 的對帳文字
          </button>
        </div>
      `;
    });
    buyerSummaryList.innerHTML = summaryHtml;
  });
</script>

</body>
</html>
